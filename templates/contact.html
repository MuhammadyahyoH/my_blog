{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="post-wrap">

    <h1 style="margin-bottom: 8px;">Contact</h1>
    <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 32px;">
        Menga xabar yuboring, tez orada javob beraman.
    </p>

        {% if success %}
    <div style="background: rgba(37,99,235,0.08); border: 1px solid var(--accent);
        color: var(--accent); padding: 12px 16px; border-radius: var(--radius-sm);
        font-size: 14px; margin-bottom: 24px;">
        ✅ Xabaringiz yuborildi! Tez orada javob beraman.
    </div>
        {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">Ism</label>
            <input type="text" name="name" placeholder="Ismingiz" required
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border);
                border-radius: var(--radius-sm); background: var(--bg);
                color: var(--text-primary); font-family: 'Inter', sans-serif;
                font-size: 14px; outline: none;">
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">Email</label>
            <input type="email" name="email" placeholder="email@example.com" required
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border);
                border-radius: var(--radius-sm); background: var(--bg);
                color: var(--text-primary); font-family: 'Inter', sans-serif;
                font-size: 14px; outline: none;">
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">Xabar</label>
            <textarea name="message" placeholder="Xabaringiz..." required rows="5"
                style="width: 100%; padding: 10px 12px; border: 1px solid var(--border);
                border-radius: var(--radius-sm); background: var(--bg);
                color: var(--text-primary); font-family: 'Inter', sans-serif;
                font-size: 14px; outline: none; resize: vertical;"></textarea>
        </div>

        <button type="submit" class="btn-primary"
            style="border: none; cursor: pointer; font-family: 'Inter', sans-serif;">
            Yuborish
        </button>

    </form>

</div>
{% endblock %}
