<h1 class="page-title">Blog</h1>

<div class="blog-container">

    {% for post in page_obj %}
        <div class="blog-card">

            <h2 class="blog-title">{{ post.title }}</h2>

            <p class="blog-text">
                {{ post.content|truncatewords:25 }}
            </p>

            <a href="{% url 'post_detail' post.id %}" class="read-more">
                See more →
            </a>

        </div>
    {% endfor %}

</div>
